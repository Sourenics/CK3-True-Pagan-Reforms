l_spanish:
 rule_tpr_variation:0 "#color_yellow TPR:#! Principios de reformas paganas"
 setting_tpr_variation_light:0 "Ligera"
 setting_tpr_variation_light_desc:0 "Cuando la IA reforma una fe pagana, #V 1#! de sus principios se cambia por otro acorde con la personalidad, el estilo de vida y la educación del reformador, o con sus vínculos con personas de otra religión. Siempre se conserva al menos un principio de la antigua fe."
 setting_tpr_variation_moderate:0 "Moderada"
 setting_tpr_variation_moderate_desc:0 "Cuando la IA reforma una fe pagana, #V 1 o 2#! de sus principios (al 50 %) se cambian por otros acordes con la personalidad, el estilo de vida y la educación del reformador, o con sus vínculos con personas de otra religión. Siempre se conserva al menos un principio de la antigua fe."
 setting_tpr_variation_strong:0 "Fuerte"
 setting_tpr_variation_strong_desc:0 "Cuando la IA reforma una fe pagana, #V 2#! de sus principios se cambian por otros acordes con la personalidad, el estilo de vida y la educación del reformador, o con sus vínculos con personas de otra religión. Siempre se conserva al menos un principio de la antigua fe."
 rule_tpr_doctrine_variation:0 "#color_yellow TPR:#! Doctrinas de reformas paganas"
 setting_tpr_doctrine_variation_none:0 "Ninguna"
 setting_tpr_doctrine_variation_none_desc:0 "Cuando la IA reforma una fe pagana, sus doctrinas no cambian."
 setting_tpr_doctrine_variation_light:0 "Ligera"
 setting_tpr_doctrine_variation_light_desc:0 "Cuando la IA reforma una fe pagana, #V 1#! de sus doctrinas pasa a una opción vecina, con más probabilidad una acorde con la personalidad, el estilo de vida, la educación, el sexo y la orientación sexual del reformador."
 setting_tpr_doctrine_variation_moderate:0 "Moderada"
 setting_tpr_doctrine_variation_moderate_desc:0 "Cuando la IA reforma una fe pagana, #V 2#! de sus doctrinas pasan a una opción vecina, con más probabilidad una acorde con la personalidad, el estilo de vida, la educación, el sexo y la orientación sexual del reformador."
 setting_tpr_doctrine_variation_strong:0 "Fuerte"
 setting_tpr_doctrine_variation_strong_desc:0 "Cuando la IA reforma una fe pagana, #V 3 o 4#! de sus doctrinas (al 50 %) pasan a una opción vecina, con más probabilidad una acorde con la personalidad, el estilo de vida, la educación, el sexo y la orientación sexual del reformador."
