name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting! Please fill in every required field: without them we usually cannot reproduce the problem.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem. What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: faith
    attributes:
      label: Faith and reformer
      description: Which faith was reformed, by whom (their traits if you can see them), and which tenets it ended up with.
      placeholder: |
        Faith: Germanic → Ásatrú
        Reformer: King X (lustful, eccentric)
        Tenets: ...
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: Game version
      description: Shown in the main menu.
      placeholder: "1.20.0.4"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - Steam Workshop
        - Manual (GitHub)
    validations:
      required: true

  - type: textarea
    id: dlcs-mods
    attributes:
      label: Active DLCs and full mod list (in load order)
    validations:
      required: true

  - type: dropdown
    id: only-this-mod
    attributes:
      label: Does it also happen with only True Pagan Reforms enabled?
      options:
        - "Yes"
        - "No"
        - Not tested
    validations:
      required: true

  - type: textarea
    id: error-log
    attributes:
      label: error.log
      description: |
        Drag and drop your error.log file into this box. It is overwritten every time the game starts: copy it right after the problem, before relaunching.
        Windows: Documents/Paradox Interactive/Crusader Kings III/logs/error.log
        Linux: ~/.local/share/Paradox Interactive/Crusader Kings III/logs/error.log
        macOS: ~/Documents/Paradox Interactive/Crusader Kings III/logs/error.log
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional, but very helpful for visual problems. Drag and drop images here.
