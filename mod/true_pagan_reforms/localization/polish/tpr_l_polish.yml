l_polish:
 rule_tpr_variation:0 "#color_yellow TPR:#! Pagan Reform Tenets"
 setting_tpr_variation_light:0 "Light"
 setting_tpr_variation_light_desc:0 "When the AI reforms a pagan faith, #V 1#! of its tenets is swapped for one that fits the reformer's personality, lifestyle and education, or their bonds with people of another religion. At least one tenet of the old faith is always kept."
 setting_tpr_variation_moderate:0 "Moderate"
 setting_tpr_variation_moderate_desc:0 "When the AI reforms a pagan faith, #V 1 or 2#! of its tenets (even odds) are swapped for ones that fit the reformer's personality, lifestyle and education, or their bonds with people of another religion. At least one tenet of the old faith is always kept."
 setting_tpr_variation_strong:0 "Strong"
 setting_tpr_variation_strong_desc:0 "When the AI reforms a pagan faith, #V 2#! of its tenets are swapped for ones that fit the reformer's personality, lifestyle and education, or their bonds with people of another religion. At least one tenet of the old faith is always kept."
 setting_tpr_variation_no_kinship:0 "No Kinship"
 setting_tpr_variation_no_kinship_desc:0 "When the AI reforms a pagan faith, #V all 3#! of its tenets are replaced with ones that fit the reformer's personality, lifestyle and education, or their bonds with people of another religion. No tenet of the old faith is kept or brought back."
 rule_tpr_doctrine_variation:0 "#color_yellow TPR:#! Pagan Reform Doctrines"
 setting_tpr_doctrine_variation_none:0 "None"
 setting_tpr_doctrine_variation_none_desc:0 "When the AI reforms a pagan faith, its doctrines are not changed."
 setting_tpr_doctrine_variation_light:0 "Light"
 setting_tpr_doctrine_variation_light_desc:0 "When the AI reforms a pagan faith, #V 1#! of its doctrines moves one step to a neighbouring option, most likely one that fits the reformer's personality, lifestyle, education, gender and sexuality."
 setting_tpr_doctrine_variation_moderate:0 "Moderate"
 setting_tpr_doctrine_variation_moderate_desc:0 "When the AI reforms a pagan faith, #V 2#! of its doctrines move one step to a neighbouring option, most likely one that fits the reformer's personality, lifestyle, education, gender and sexuality."
 setting_tpr_doctrine_variation_strong:0 "Strong"
 setting_tpr_doctrine_variation_strong_desc:0 "When the AI reforms a pagan faith, #V 3 or 4#! of its doctrines (even odds) move one step to a neighbouring option, most likely one that fits the reformer's personality, lifestyle, education, gender and sexuality."
 setting_tpr_doctrine_variation_radical:0 "Radical"
 setting_tpr_doctrine_variation_radical_desc:0 "When the AI reforms a pagan faith, #V 4 to 6#! of its doctrines (even odds) move one step to a neighbouring option, most likely one that fits the reformer's personality, lifestyle, education, gender and sexuality."
