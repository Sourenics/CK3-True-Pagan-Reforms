 rule_tpr_variation:0 "Pagan Reform Variation"
 setting_tpr_variation_light:0 "Light"
 setting_tpr_variation_light_desc:0 "When the AI reforms a pagan faith, #V 1#! of its tenets is swapped for one that fits the reformer's personality, lifestyle and education. At least one tenet of the old faith is always kept."
 setting_tpr_variation_moderate:0 "Moderate"
 setting_tpr_variation_moderate_desc:0 "When the AI reforms a pagan faith, #V 1 or 2#! of its tenets (even odds) are swapped for ones that fit the reformer's personality, lifestyle and education. At least one tenet of the old faith is always kept."
 setting_tpr_variation_strong:0 "Strong"
 setting_tpr_variation_strong_desc:0 "When the AI reforms a pagan faith, #V 2#! of its tenets are swapped for ones that fit the reformer's personality, lifestyle and education. At least one tenet of the old faith is always kept."
